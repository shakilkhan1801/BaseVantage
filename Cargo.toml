[package]
name = "basevantage"
version = "0.1.0"
edition = "2024"
description = "BaseVantage — Base-chain trading engine core"
license = "UNLICENSED"

[dependencies]
alloy = { version = "1", features = ["full"] }
async-trait = "0.1"
clap = { version = "4", features = ["derive"] }
futures = "0.3"
hex = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha3 = "0.10"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
tempfile = "3"

[[bin]]
name = "bv"
path = "src/bin/bv.rs"
